# Pre-commit hooks run on `git commit`. Code lives in backend/, so hooks are
# scoped there; ruff auto-discovers backend/pyproject.toml for its config.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff (format)
        files: ^backend/
