[project]
name = "ai-prep-buddy-backend"
version = "0.1.0"
description = "AI Prep Buddy backend — an AI interview-prep coach (RAG, quiz, interview bot, planner)."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "litellm>=1.109.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "httpx>=0.28.1",
]

# No [build-system]: this is a virtual (application) project. uv manages the
# environment and dependencies but does not build/install `app` as a package;
# tools run from this directory with `app/` on the path.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# F=pyflakes, E=pycodestyle, I=isort, UP=pyupgrade, B=bugbear, SIM=simplify,
# C4=comprehensions, ASYNC=async pitfalls, RUF=ruff-specific.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations: allow long lines and alembic's import ordering.
"alembic/versions/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["uuid6", "prometheus_fastapi_instrumentator", "litellm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: requires live infra (postgres/redis/qdrant); run via `make test-int`",
]
